[project]
name = "deutschdeploy21-api"
version = "0.1.0"
description = "DeutschDeploy21 FastAPI application and worker"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "boto3>=1.40,<2",
  "email-validator>=2,<3",
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "redis>=6,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
