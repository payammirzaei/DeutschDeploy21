services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deutschdeploy
      POSTGRES_USER: deutschdeploy
      POSTGRES_PASSWORD: deutschdeploy
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deutschdeploy -d deutschdeploy"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://deutschdeploy:deutschdeploy@postgres:5432/deutschdeploy
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_BACKEND: filesystem
      MEDIA_ROOT: /data/media
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes: ["speech_media:/data/media"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://deutschdeploy:deutschdeploy@postgres:5432/deutschdeploy
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_BACKEND: filesystem
      MEDIA_ROOT: /data/media
    volumes: ["speech_media:/data/media"]
    command: ["uv", "run", "python", "-m", "app.worker.main"]
    depends_on:
      api: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  speech_media:
