name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --dev
      - name: Python lint and tests
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run pytest
      - name: Export OpenAPI
        env:
          APP_ENV: test
          APP_SECRET_KEY: test-secret-key-that-is-longer-than-thirty-two-characters
          DATABASE_URL: postgresql://user:pass@localhost:5432/unused
          REDIS_URL: redis://localhost:6379/15
        run: |
          cd apps/api
          uv run python -m app.scripts.export_openapi
      - name: Install web dependencies and generate API types
        run: |
          npm install
          npm run api:generate
      - name: Web lint, types and build
        run: |
          npm run web:lint
          npm run web:typecheck
          npm run web:build
